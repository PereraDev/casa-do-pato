<!-- Casa do Pato — painel administrativo (protótipo) -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa do Pato — Admin</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #F3ECDC;
    --surface: #FFFCF3;
    --surface-2: #EAE0C4;
    --border: #D6C7A1;
    --ink: #2B2420;
    --ink-muted: #7C6F55;
    --accent: #C1272D;
    --accent-ink: #FFF7E8;
    --good: #3F7D42;
    --good-bg: #DEEAD5;
    --bad: #8C3A2E;
    --bad-bg: #F0DACF;
    --warn: #B8860B;
    --warn-bg: #F2E2B8;
    --neutral: #6E6552;
    --neutral-bg: #E8DFC6;
    --shadow: 2px 3px 0 rgba(43,36,32,0.09), 0 1px 2px rgba(43,36,32,0.06);

    --rail-bg: #22262A;
    --rail-bg-2: #191C1F;
    --rail-text: #C7CBC6;
    --rail-text-dim: #83898B;
    --rail-active-bg: #30363B;
    --rail-active-text: #F6F2E6;
    --rail-accent: #E8A33D;
    --rail-border: #363C41;

    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Karla', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1712;
      --surface: #25201A;
      --surface-2: #302921;
      --border: #473B2D;
      --ink: #F1E7D2;
      --ink-muted: #B3A786;
      --accent: #E9573F;
      --accent-ink: #271306;
      --good: #86BB75;
      --good-bg: #263320;
      --bad: #E38A76;
      --bad-bg: #3A241D;
      --warn: #E8BE55;
      --warn-bg: #3A2E13;
      --neutral: #A79B7D;
      --neutral-bg: #302921;
      --shadow: 2px 3px 0 rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C1712;
    --surface: #25201A;
    --surface-2: #302921;
    --border: #473B2D;
    --ink: #F1E7D2;
    --ink-muted: #B3A786;
    --accent: #E9573F;
    --accent-ink: #271306;
    --good: #86BB75;
    --good-bg: #263320;
    --bad: #E38A76;
    --bad-bg: #3A241D;
    --warn: #E8BE55;
    --warn-bg: #3A2E13;
    --neutral: #A79B7D;
    --neutral-bg: #302921;
    --shadow: 2px 3px 0 rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; max-width: 100%; overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  select, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  /* O popup do <select> é nativo e fica branco por padrão; com o texto claro do
     tema escuro herdado (color: inherit) as opções somem. Fixa fundo e texto do
     campo e das opções em qualquer select que não tenha regra própria. */
  select, select option { background-color: var(--surface); color: var(--ink); }
  .panel > select, .pdv-field select { padding: 9px 10px; border: 1px solid var(--border); border-radius: 4px; background-color: var(--bg); outline: none; }
  .panel > select:focus, .pdv-field select:focus { border-color: var(--accent); }
  a { color: inherit; }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* ---------- Layout shell ---------- */
  #app { display: flex; min-height: 100vh; }

  /* ---------- Login ---------- */
  #login-screen {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 13px),
      var(--rail-bg);
    padding: 24px;
  }
  .login-card {
    width: 100%; max-width: 380px;
    background: var(--rail-bg-2);
    border: 1px solid var(--rail-border);
    border-top: 4px solid var(--rail-accent);
    border-radius: 3px;
    padding: 40px 36px 32px;
    box-shadow: 4px 6px 0 rgba(0,0,0,0.35);
  }
  .login-mark {
    display: flex; align-items: baseline; gap: 8px; justify-content: center;
    color: var(--rail-active-text);
    margin-bottom: 4px;
  }
  .login-mark img { display: block; width: min(260px, 100%); height: auto; margin: 0 auto; }
  .login-mark span.name { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; text-transform: uppercase; letter-spacing: 0.02em; }
  .login-sub {
    text-align: center; color: var(--rail-text-dim); font-size: 0.78rem; font-family: var(--font-mono);
    letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 32px;
  }
  .login-field { margin-bottom: 16px; }
  .login-field label {
    display: block; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--rail-text-dim); margin-bottom: 6px; font-family: var(--font-mono);
  }
  .login-field input {
    width: 100%; padding: 11px 12px; border-radius: 3px;
    border: 1px solid var(--rail-border); background: #100E0A; color: var(--rail-active-text);
    outline: none;
  }
  .login-field input:focus { border-color: var(--rail-accent); }
  .login-submit {
    width: 100%; margin-top: 10px; padding: 12px; border-radius: 3px; border: none;
    background: var(--rail-accent); color: #241705; font-weight: 700; font-size: 0.88rem;
    letter-spacing: 0.06em; text-transform: uppercase; font-family: var(--font-display);
    box-shadow: 0 3px 0 rgba(0,0,0,0.35);
  }
  .login-submit:hover { filter: brightness(1.08); }
  .login-submit:active { transform: translateY(3px); box-shadow: none; }
  .login-hint { text-align: center; margin-top: 16px; font-size: 0.74rem; color: var(--rail-text-dim); }
  .login-error { text-align: center; margin-top: 10px; font-size: 0.8rem; color: #ff6b6b; }

  /* ---------- Sidebar rail ---------- */
  #rail {
    width: 234px; flex: 0 0 234px;
    background: var(--rail-bg);
    border-right: 1px solid var(--rail-border);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
  }
  .rail-brand {
    padding: 22px 20px 18px;
    border-bottom: 1px solid var(--rail-border);
    display: flex; align-items: baseline; gap: 8px;
  }
  .rail-brand img { width: 34px; height: 34px; border-radius: 8px; flex: none; }
  .rail-brand .name { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; text-transform: uppercase; letter-spacing: 0.01em; color: var(--rail-active-text); }
  .rail-brand .tag { display: block; font-size: 0.66rem; font-family: var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--rail-text-dim); margin-top: 2px; }

  /* Busca que filtra os itens do trilho por nome — o principal atalho pra
     não precisar escanear as ~25 seções/8 grupos visualmente toda vez. */
  .rail-search { padding: 4px 14px 8px; }
  .rail-search input {
    width: 100%; padding: 7px 10px; border-radius: 3px;
    border: 1px solid var(--rail-border); background: var(--rail-bg-2); color: var(--rail-active-text);
    font-size: 0.78rem; font-family: var(--font-mono); outline: none;
  }
  .rail-search input::placeholder { color: var(--rail-text-dim); }
  .rail-search input:focus { border-color: var(--rail-accent); }

  nav.rail-nav { flex: 1; padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 0; overflow-y: auto; }
  .rail-group { display: flex; flex-direction: column; }
  .rail-group-label {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    width: 100%; background: none; border: none; text-align: left; cursor: pointer;
    font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--rail-text-dim); font-family: var(--font-mono);
    padding: 14px 12px 4px;
  }
  .rail-group:first-child .rail-group-label { padding-top: 4px; }
  .rail-group-label:hover { color: var(--rail-text); }
  .rail-group-label .chev { width: 10px; height: 10px; flex: 0 0 10px; opacity: 0.7; transition: transform 120ms ease; }
  .rail-group.collapsed .rail-group-label .chev { transform: rotate(-90deg); }
  .rail-group-items { display: flex; flex-direction: column; gap: 2px; }
  .rail-group.collapsed .rail-group-items { display: none; }
  .rail-btn {
    display: flex; align-items: center; gap: 11px;
    background: none; border: none; border-left: 3px solid transparent; text-align: left;
    color: var(--rail-text); padding: 10px 12px 10px 9px; border-radius: 0 3px 3px 0;
    font-size: 0.875rem; font-weight: 500;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
  }
  .rail-btn .ic { width: 18px; height: 18px; flex: 0 0 18px; display: inline-flex; }
  .rail-btn .ic svg { width: 100%; height: 100%; }
  .rail-btn:hover { background: var(--rail-active-bg); color: var(--rail-active-text); }
  .rail-btn.active { background: var(--rail-active-bg); color: var(--rail-active-text); border-left-color: var(--rail-accent); }
  .rail-btn.active .ic { color: var(--rail-accent); }

  .rail-foot {
    padding: 14px 18px 18px; border-top: 1px solid var(--rail-border);
    display: flex; align-items: center; gap: 10px;
  }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex: 0 0 32px;
    background: var(--rail-accent); color: #241705; font-weight: 700; font-size: 0.8rem;
    font-family: var(--font-display);
    display: flex; align-items: center; justify-content: center;
  }
  .rail-foot .who { font-size: 0.8rem; color: var(--rail-active-text); line-height: 1.25; }
  .rail-foot .who small { display: block; color: var(--rail-text-dim); font-size: 0.7rem; }
  .logout-btn { margin-left: auto; background: none; border: none; color: var(--rail-text-dim); font-size: 0.72rem; text-decoration: underline; }
  .logout-btn:hover { color: var(--rail-active-text); }

  /* ---------- Mobile nav (hamburger + overlay) ---------- */
  .hamburger-btn {
    display: none; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 4px; flex: 0 0 auto;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  }
  .hamburger-btn svg { width: 19px; height: 19px; }
  .hamburger-btn:hover { border-color: var(--accent); }
  #railOverlay {
    position: fixed; inset: 0; background: rgba(10,12,8,0.5); z-index: 55;
    opacity: 0; pointer-events: none; transition: opacity 200ms ease;
  }
  #railOverlay.open { opacity: 1; pointer-events: auto; }

  /* ---------- Main ---------- */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  #topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 20px 32px; border-bottom: 1px solid var(--border);
    background: var(--bg); position: sticky; top: 0; z-index: 5;
    flex-wrap: wrap;
  }
  #topbar h1 { font-size: 1.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.01em; }
  #topbar .sub { color: var(--ink-muted); font-size: 0.82rem; margin-top: 2px; }

  .stamp {
    display: flex; align-items: center; gap: 10px;
    border: 2px solid var(--accent);
    border-radius: 4px; padding: 6px 12px;
    transform: rotate(-2deg);
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 6%, transparent);
  }
  .stamp .stamp-label { font-size: 0.66rem; font-family: var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .stamp select {
    background: none; border: none; color: var(--accent); font-weight: 700; font-size: 0.85rem;
    font-family: var(--font-mono);
    padding: 2px 4px; border-radius: 3px; outline: none;
  }
  .stamp select:focus { outline: 2px solid var(--accent); }
  /* O menu suspenso do <select> usa aparência nativa do SO/navegador e ignora
     "background: none" do elemento — sem isso, o texto claro do tema escuro
     fica ilegível num popup que o navegador pinta de branco por padrão. */
  .stamp select option, .add-form select option { background: var(--surface); color: var(--ink); }

  #content { padding: 26px 32px 60px; flex: 1; }
  section.view { display: none; }
  section.view.active { display: block; }

  /* ---------- Reusable bits ---------- */
  .grid { display: grid; gap: 16px; }
  .kpis { grid-template-columns: repeat(4, minmax(0,1fr)); margin-bottom: 22px; }
  .kpis-3 { grid-template-columns: repeat(3, minmax(0,1fr)); margin-bottom: 22px; }
  @media (max-width: 900px) { .kpis, .kpis-3 { grid-template-columns: repeat(2, minmax(0,1fr)); } }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 3px; box-shadow: var(--shadow);
  }
  .kpi { padding: 16px 18px 18px; border-top: 3px dashed var(--border); }
  .kpi .label { font-size: 0.7rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-muted); font-weight: 600; font-family: var(--font-mono); }
  .kpi .value { font-family: var(--font-mono); font-size: 1.7rem; font-weight: 600; margin-top: 8px; }
  .kpi .delta { font-size: 0.76rem; margin-top: 6px; font-family: var(--font-mono); }
  .kpi .delta.up { color: var(--good); }
  .kpi .delta.down { color: var(--bad); }

  .panel { padding: 20px 22px; margin-bottom: 20px; border-top: 3px dashed var(--border); }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .panel-head h2 { font-size: 1.05rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.01em; }
  .panel-head .meta { font-size: 0.78rem; color: var(--ink-muted); font-family: var(--font-mono); }

  .two-col { grid-template-columns: 1.3fr 1fr; align-items: start; }
  @media (max-width: 980px) { .two-col { grid-template-columns: 1fr; } }

  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .table-wrap { overflow-x: auto; }
  th { text-align: left; font-size: 0.68rem; font-family: var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); font-weight: 600; padding: 0 12px 10px; border-bottom: 1px dashed var(--border); white-space: nowrap; }
  td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: none; }

  /* Selo/carimbo de status — em vez de pílula suave, imita um carimbo de
     tinta batido na comanda (borda sólida, mono, leve rotação). */
  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px;
    border-radius: 3px; border: 1.5px solid currentColor; background: none;
    font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap;
    transform: rotate(-1.5deg);
  }
  .pill.good { color: var(--good); }
  .pill.bad { color: var(--bad); }
  .pill.warn { color: var(--warn); }
  .pill.neutral { color: var(--neutral); }

  /* Placar de atendimento (aba Garçons) — gamificação da equipe pela nota
     do cliente, não do cliente pelo consumo (ver renderGarcons). */
  .placar-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .placar-card {
    flex: 1 1 220px; padding: 16px 18px; border-radius: 3px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 4px;
  }
  .placar-card.pos-1 { border-color: var(--accent); border-top: 3px solid var(--accent); background: linear-gradient(180deg, var(--warn-bg), var(--surface) 70%); }
  .placar-medalha { font-size: 1.5rem; line-height: 1; }
  .placar-nome { font-weight: 700; font-size: 0.95rem; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.01em; }
  .placar-nota { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 600; color: var(--accent); }
  .placar-sub { font-size: 0.72rem; color: var(--ink-muted); font-family: var(--font-mono); }
  .medalha-inline { margin-right: 4px; }

  /* Botões: cantos secos + sombra sólida deslocada, feito tecla de
     máquina de pedido/PDV — "afunda" ao clicar (:active). */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    padding: 8px 14px; border-radius: 4px; font-size: 0.8rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.03em;
    box-shadow: 0 2px 0 var(--border);
    transition: transform 80ms ease, box-shadow 80ms ease;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:active { transform: translateY(2px); box-shadow: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 0 var(--bad); }
  .btn.primary:hover { filter: brightness(1.06); color: var(--accent-ink); }
  .btn.ghost { background: none; border: none; color: var(--ink-muted); padding: 6px 8px; box-shadow: none; text-transform: none; letter-spacing: normal; font-weight: 600; }
  .btn.ghost:hover { color: var(--bad); }
  .btn.ghost:active { transform: none; }
  .btn.small { padding: 5px 10px; font-size: 0.7rem; }

  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-muted);
    padding: 6px 13px; border-radius: 999px; font-size: 0.76rem; font-weight: 700;
    font-family: var(--font-mono);
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip:hover:not(.active) { border-color: var(--accent); color: var(--ink); }

  /* Dashboard chart */
  .chart-wrap { padding: 4px 4px 0; }
  #revenueChart { width: 100%; height: 190px; display: block; }
  .bar-list { display: flex; flex-direction: column; gap: 12px; }
  .bar-list .row { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; font-size: 0.82rem; }
  .bar-list .bar-track { grid-column: 1 / -1; height: 7px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .bar-list .bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }

  /* Pratos */
  .dish-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .dish-grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .dish-card { padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  .dish-top { display: flex; justify-content: space-between; gap: 10px; }
  .dish-icon {
    width: 40px; height: 40px; border-radius: 4px; flex: 0 0 40px;
    background: var(--surface-2); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 1.1rem;
  }
  .dish-photo {
    width: 40px; height: 40px; border-radius: 4px; flex: 0 0 40px;
    object-fit: cover;
  }
  .foto-preview { display: block; margin-top: 6px; width: 70px; height: 70px; border-radius: 4px; object-fit: cover; }
  .dish-card h3 { font-size: 0.95rem; font-weight: 700; }
  .dish-cat { font-size: 0.68rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted); }
  .dish-desc { font-size: 0.8rem; color: var(--ink-muted); flex: 1; }
  .dish-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dish-price { font-family: var(--font-mono); font-weight: 600; font-size: 1rem; }
  .dish-actions { display: flex; gap: 6px; }

  .add-form {
    display: grid; grid-template-columns: 1.4fr 1fr 0.8fr; gap: 10px; margin-bottom: 4px;
  }
  .add-form .full { grid-column: 1 / -1; }
  .add-form label { font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); display: block; margin-bottom: 5px; font-weight: 600; }
  .add-form input, .add-form select, .add-form textarea {
    width: 100%; padding: 9px 10px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--bg); color: var(--ink); outline: none;
  }
  .add-form input:focus, .add-form select:focus, .add-form textarea:focus { border-color: var(--accent); }
  .add-form textarea { resize: vertical; min-height: 40px; font-family: inherit; }
  @media (max-width: 700px) { .add-form { grid-template-columns: 1fr 1fr; } }
  .form-nota { font-size: 0.8rem; color: var(--ink-muted); margin: 0; }

  .funcoes-lista { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .funcao-pill { display: inline-flex; align-items: center; gap: 6px; }
  .funcao-remover {
    background: none; border: none; color: inherit; opacity: 0.7; cursor: pointer;
    font-size: 0.7rem; line-height: 1; padding: 0;
  }
  .funcao-remover:hover:not(:disabled) { opacity: 1; }
  .funcao-remover:disabled { cursor: not-allowed; opacity: 0.35; }

  /* minmax(200px, 210px), não minmax(200px, 1fr): o 1fr esticava cada coluna
     pra preencher o painel inteiro, afastando os grupos uns dos outros com
     vãos enormes em telas largas (ex.: "Operação" e "Vendas" nas pontas
     opostas do card) e empurrando o .meta ao lado do título pra fora da
     área visível. Largura fixa mantém as colunas compactas e agrupadas. */
  .secoes-checklist {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 210px));
    gap: 12px 24px; margin-top: 6px;
  }
  .secoes-checklist-grupo { display: flex; flex-direction: column; gap: 6px; }
  .secoes-checklist-grupo-label {
    font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-muted); font-weight: 700;
  }
  /* especificidade maior que ".add-form label"/".add-form input" de propósito:
     o checklist mora dentro de um <form class="add-form"> (cadastro de
     funcionário), e aquelas regras genéricas (display:block + uppercase no
     label, width:100% + caixa estilizada no input) vazavam pra cá, quebrando
     o checkbox e o texto de cada item em linhas separadas. */
  .secoes-checklist .secoes-checklist-item {
    display: flex; align-items: center; gap: 7px; font-size: 0.82rem; color: var(--ink);
    text-transform: none; letter-spacing: normal; font-weight: 400; margin-bottom: 0;
  }
  .secoes-checklist .secoes-checklist-item input {
    width: auto; margin: 0; padding: 0; border: 0; background: none; outline: revert;
  }

  /* Avaliações */
  .rating-summary { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; flex-wrap: wrap; }
  .rating-big { font-family: var(--font-mono); font-size: 2.1rem; font-weight: 600; }
  .stars { color: var(--accent); letter-spacing: 1px; font-size: 0.95rem; }
  .stars .off { color: var(--border); }
  .review-list { display: flex; flex-direction: column; gap: 12px; }
  .review-card { padding: 14px 18px; }
  .review-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .review-head .who { font-weight: 700; font-size: 0.88rem; }
  .review-head .when { font-size: 0.74rem; color: var(--ink-muted); }
  .review-dish { font-size: 0.72rem; font-family: var(--font-mono); color: var(--accent); background: var(--surface-2); display: inline-block; padding: 2px 8px; border-radius: 3px; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
  .review-text { font-size: 0.86rem; color: var(--ink); }

  /* Mesas */
  .table-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .table-tile {
    padding: 16px; text-align: left; border: 1px solid var(--border); border-radius: 4px;
    background: var(--surface); display: flex; flex-direction: column; gap: 8px;
  }
  .table-tile:hover { border-color: var(--accent); }
  .table-tile .tnum { font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; }
  .table-tile .tcap { font-size: 0.74rem; color: var(--ink-muted); }
  .table-tile .torder { font-size: 0.72rem; color: var(--ink-muted); font-family: var(--font-mono); }
  .legend { display: flex; gap: 16px; font-size: 0.78rem; color: var(--ink-muted); margin-bottom: 16px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* misc */
  .empty { padding: 30px; text-align: center; color: var(--ink-muted); font-size: 0.85rem; }
  .section-note { font-size: 0.78rem; color: var(--ink-muted); margin-top: -6px; margin-bottom: 18px; }
  .avatar-sm { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); color: var(--accent); font-size: 0.68rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-right: 8px; font-family: var(--font-display); }
  .name-cell { display: flex; align-items: center; }

  /* ---------- PDV ---------- */
  .caixa-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    padding: 14px 18px; margin-bottom: 18px;
  }
  .caixa-bar .who { font-size: 0.85rem; }
  .caixa-bar .who b { font-weight: 700; }
  .caixa-bar .who small { display: block; color: var(--ink-muted); font-size: 0.74rem; margin-top: 2px; }
  .caixa-fechado { max-width: 420px; margin: 10px auto 0; text-align: center; }
  .caixa-fechado .flame-lg { font-size: 2.2rem; display: block; margin-bottom: 6px; }
  .pdv-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 1100px) { .pdv-grid { grid-template-columns: 1fr; } }
  .pdv-produtos { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .pdv-produto {
    text-align: left; padding: 12px; display: flex; flex-direction: column; gap: 6px;
    border: 1px solid var(--border); border-radius: 4px; background: var(--surface);
  }
  .pdv-produto:hover:not(:disabled) { border-color: var(--accent); }
  .pdv-produto:disabled { opacity: 0.45; cursor: not-allowed; }
  .pdv-produto .nome { font-size: 0.84rem; font-weight: 600; }
  .pdv-produto .preco { font-family: var(--font-mono); color: var(--accent); font-size: 0.82rem; font-weight: 700; }
  .pdv-produto .estoque-tag { font-size: 0.68rem; color: var(--warn); }
  .pdv-comanda { position: sticky; top: 90px; }
  .pdv-comanda-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.84rem; }
  .pdv-comanda-item .nome { flex: 1; }
  .pdv-comanda-item .qtd-ctrl { display: flex; align-items: center; gap: 6px; }
  .pdv-comanda-item .qtd-ctrl button { width: 22px; height: 22px; border-radius: 3px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); line-height: 1; }
  .pdv-toggle-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .pdv-toggle-row button { flex: 1; padding: 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); font-size: 0.8rem; font-weight: 600; }
  .pdv-toggle-row button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pdv-field { margin-bottom: 12px; }
  .pdv-field label { display: block; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 5px; font-weight: 600; }
  .pdv-field input { width: 100%; padding: 9px 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); outline: none; }
  .pdv-total-row { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; font-size: 1.05rem; font-weight: 700; }
  .pdv-dividir-toggle { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--ink); margin-bottom: 12px; cursor: pointer; }
  .pdv-divisao { margin-bottom: 12px; }
  .pdv-divisao-cabecalho { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 0.85rem; font-weight: 600; }
  .pdv-divisao-cabecalho .qtd-ctrl { display: flex; align-items: center; gap: 8px; }
  .pdv-divisao-cabecalho .qtd-ctrl button { width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); line-height: 1; }
  .pdv-divisao-pessoa { padding: 10px 0; border-top: 1px solid var(--border); }
  .pdv-divisao-pessoa-nome { display: block; font-size: 0.8rem; margin-bottom: 8px; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10,12,8,0.55); z-index: 70;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-card { width: 100%; max-width: 420px; padding: 24px; }
  .modal-card h3 { margin-bottom: 14px; }
  .resumo-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
  .resumo-row:last-child { border-bottom: none; }

  /* Recibo: fica escondido na tela, só aparece ao imprimir (window.print) */
  #reciboImprimir { display: none; }
  @media print {
    body * { visibility: hidden; }
    #reciboImprimir, #reciboImprimir * { visibility: visible; }
    #reciboImprimir { display: block; position: fixed; top: 0; left: 0; width: 100%; padding: 20px; font-family: var(--font-mono); color: #000; background: #fff; }
    #reciboImprimir h2 { font-family: var(--font-mono); }
    #reciboImprimir .linha { display: flex; justify-content: space-between; font-size: 0.85rem; }
    #reciboImprimir hr { border: none; border-top: 1px dashed #000; margin: 10px 0; }
    #reciboImprimir .aviso-fiscal { margin-top: 16px; font-size: 0.7rem; text-align: center; }
  }

  /* Estoque (dentro do card de prato em Pratos) */
  .estoque-ctrl { display: flex; align-items: center; gap: 6px; font-size: 0.76rem; color: var(--ink-muted); }
  .estoque-ctrl input { width: 60px; padding: 4px 6px; border-radius: 3px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); font-family: var(--font-mono); }
  /* ---------- Mobile layout overrides (kept last to win the cascade) ---------- */
  @media (max-width: 860px) {
    #app { display: block; }
    #rail {
      position: fixed; top: 0; left: 0; width: 240px; z-index: 60;
      transform: translateX(-100%); transition: transform 200ms ease;
      box-shadow: 20px 0 50px -20px rgba(0,0,0,0.5);
    }
    #rail.open { transform: translateX(0); }
    main { width: 100%; }
    .hamburger-btn { display: inline-flex; }
    #topbar { padding: 16px 18px; }
    #content { padding: 18px 18px 50px; }
    .kpis, .kpis-3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  }
  @media (max-width: 480px) {
    .kpis, .kpis-3 { grid-template-columns: 1fr; }
    .dish-grid { grid-template-columns: 1fr; }
    .table-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .add-form { grid-template-columns: 1fr; }
    #topbar h1 { font-size: 1.2rem; }
    .rating-summary { gap: 12px; }
  }
</style>
